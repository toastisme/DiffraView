<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
			background-color: #020817;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .logo {
            width: 30%;
            height: auto;
            margin: 20vh auto 0 auto;
        }

        .bar-loader {
            width: 800px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            margin: 20px auto;
        }

        .bar-loader::after {
            content: '';
            position: absolute;
            width: 40%;
            height: 100%;
            background-color: #fff;
            animation: loading 1s infinite;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        .pixel-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .pixel {
            position: absolute;
            transition: opacity 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <img src="./src/assets/logo_large.png" alt="DiffraView Logo" class="logo">
    <div class="bar-loader"></div>
    <div class="pixel-container" id="pixelContainer"></div>

    <script>
		// Five concentric Debye-Scherrer rings centred at (50%, 50%) of the
		// 1024×800 splash window. Rings 1/3/5 are green; rings 2/4 are blue.
		// x/y radii differ (xr = r/1024*100, yr = r/800*100) so rings are
		// circular in pixel space despite the non-square viewport.
		const pattern = [
			// Ring 1 – green (r = 70 px, 8 spots)
			{ x: 56.8, y: 50.0 },
			{ x: 54.8, y: 56.2 },
			{ x: 50.0, y: 58.8 },
			{ x: 45.2, y: 56.2 },
			{ x: 43.2, y: 50.0 },
			{ x: 45.2, y: 43.8 },
			{ x: 50.0, y: 41.2 },
			{ x: 54.8, y: 43.8 },
			// Ring 3 – green (r = 195 px, 16 spots)
			{ x: 69.0, y: 50.0 },
			{ x: 67.6, y: 59.3 },
			{ x: 63.5, y: 67.2 },
			{ x: 57.3, y: 72.5 },
			{ x: 50.0, y: 74.4 },
			{ x: 42.7, y: 72.5 },
			{ x: 36.5, y: 67.2 },
			{ x: 32.4, y: 59.3 },
			{ x: 31.0, y: 50.0 },
			{ x: 32.4, y: 40.7 },
			{ x: 36.5, y: 32.8 },
			{ x: 42.7, y: 27.5 },
			{ x: 50.0, y: 25.6 },
			{ x: 57.3, y: 27.5 },
			{ x: 63.5, y: 32.8 },
			{ x: 67.6, y: 40.7 },
			// Ring 5 – green (r = 330 px, 24 spots)
			{ x: 82.2, y: 50.0 },
			{ x: 81.1, y: 60.7 },
			{ x: 77.9, y: 70.6 },
			{ x: 72.8, y: 79.2 },
			{ x: 66.1, y: 85.7 },
			{ x: 58.3, y: 89.8 },
			{ x: 50.0, y: 91.2 },
			{ x: 41.7, y: 89.8 },
			{ x: 33.9, y: 85.7 },
			{ x: 27.2, y: 79.2 },
			{ x: 22.1, y: 70.6 },
			{ x: 18.9, y: 60.7 },
			{ x: 17.8, y: 50.0 },
			{ x: 18.9, y: 39.3 },
			{ x: 22.1, y: 29.4 },
			{ x: 27.2, y: 20.8 },
			{ x: 33.9, y: 14.3 },
			{ x: 41.7, y: 10.2 },
			{ x: 50.0, y:  8.8 },
			{ x: 58.3, y: 10.2 },
			{ x: 66.1, y: 14.3 },
			{ x: 72.8, y: 20.8 },
			{ x: 77.9, y: 29.4 },
			{ x: 81.1, y: 39.3 },
			// Ring 2 – blue (r = 130 px, 12 spots, offset 15°)
			{ x: 62.3, y: 54.2 },
			{ x: 59.0, y: 61.5 },
			{ x: 53.3, y: 65.7 },
			{ x: 46.7, y: 65.7 },
			{ x: 41.0, y: 61.5 },
			{ x: 37.7, y: 54.2 },
			{ x: 37.7, y: 45.8 },
			{ x: 41.0, y: 38.5 },
			{ x: 46.7, y: 34.3 },
			{ x: 53.3, y: 34.3 },
			{ x: 59.0, y: 38.5 },
			{ x: 62.3, y: 45.8 },
			// Ring 4 – blue (r = 260 px, 20 spots, offset 9°)
			{ x: 75.1, y: 55.1 },
			{ x: 72.6, y: 64.8 },
			{ x: 68.0, y: 73.0 },
			{ x: 61.5, y: 79.0 },
			{ x: 54.0, y: 82.1 },
			{ x: 46.0, y: 82.1 },
			{ x: 38.5, y: 79.0 },
			{ x: 32.0, y: 73.0 },
			{ x: 27.4, y: 64.8 },
			{ x: 24.9, y: 55.1 },
			{ x: 24.9, y: 44.9 },
			{ x: 27.4, y: 35.2 },
			{ x: 32.0, y: 27.0 },
			{ x: 38.5, y: 21.0 },
			{ x: 46.0, y: 17.9 },
			{ x: 54.0, y: 17.9 },
			{ x: 61.5, y: 21.0 },
			{ x: 68.0, y: 27.0 },
			{ x: 72.6, y: 35.2 },
			{ x: 75.1, y: 44.9 },
		];

        function createPixel() {
            const randomIndex = Math.floor(Math.random() * pattern.length);
            const newPos = { ...pattern[randomIndex] };
            
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            
            const width = 3 + Math.random() * 5;
            const height = 3 + Math.random() * 5;
            const color = randomIndex < 48 ? "#96f97b" : "#75bbfd";
            
            const randomPerturbationX = (Math.random() * 0.2 - 0.1);
            const randomPerturbationY = (Math.random() * 0.2 - 0.1);
            
            const x = Math.max(0, Math.min(100, newPos.x + randomPerturbationX));
            const y = Math.max(0, Math.min(100, newPos.y + randomPerturbationY));
            
            pixel.style.width = `${width}px`;
            pixel.style.height = `${height}px`;
            pixel.style.backgroundColor = color;
            pixel.style.left = `${x}%`;
            pixel.style.top = `${y}%`;
            pixel.style.animation = 'fadeIn 0.3s forwards';
            
            return pixel;
        }

        const container = document.getElementById('pixelContainer');
        let pixelCount = 0;
        const maxPixels = 400;

        function addPixel() {
            if (pixelCount >= maxPixels) return;
            
            const pixel = createPixel();
            container.appendChild(pixel);
            pixelCount++;
            
            const nextInterval = Math.random() * 500 + 100;
            setTimeout(addPixel, nextInterval);
        }

        addPixel();
    </script>
</body>
</html>
