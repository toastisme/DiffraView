<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DIALS Reciprocal Lattice Viewer</title>
	<style>body{margin:0}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:0 0}::-webkit-scrollbar-thumb{background:#30425f;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#455e87}::-webkit-scrollbar-corner{background:0 0}</style>
  <script type="module" crossorigin src="./assets/main-DPvMVqWr.js"></script>
</head>
<body>
	<header id="headerText"> </header>
	<sidebar id="sidebar" style="width: 260px; padding: 10px;">
		<button id="sidebarToggle" onclick="window.viewer.toggleSidebar()" aria-label="Toggle sidebar">
			❮
		</button>
		<script>
			function updateUnindexedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateUnindexedReflectionsVisibility()
			}

			function updateIndexedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateIndexedReflectionsVisibility()
			}

			function updateCalculatedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateCalculatedReflectionsVisibility()
			}

			function updateIntegratedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateIntegratedReflectionsVisibility()
			}

			function updateReflectionSize(){
				window.viewer.disableMouseClick();
				window.viewer.updateReflectionSize();
			}

			function updateReciprocalCell(){
				window.viewer.disableMouseClick();
				window.viewer.updateReciprocalCellsVisibility();
			}

			function updateCrystalFrame(){
				window.viewer.disableMouseClick();
				window.viewer.updateCrystalFrame();
			}

			function updateEwaldSpheres(){
				window.viewer.disableMouseClick();
				window.viewer.updateEwaldSpheresVisibility();
			}

			function recalculateMesh(){
				window.viewer.disableMouseClick(); 
				window.viewer.recalculateMesh();
			}

			function updateMaxResolutionValue(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateMaxResolutionValue();
			}


			function updateMesh(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateMesh();
			}

			function updateThresholdValue(){
				window.viewer.disableMouseClick();
				window.viewer.updateMeshThresholdValue();
			}

			function updateMillerIndexLabels(){
				window.viewer.disableMouseClick();
				window.viewer.updateMillerIndexLabelsVisibility();
			}

			function updateMillerIndexLabelSize(){
				window.viewer.disableMouseClick();
				window.viewer.updateMillerIndexLabelSize();
			}

			function alignCameraToAxis(axisIndex){
				window.viewer.alignCameraToRealSpaceAxis(axisIndex);
			}

		</script>
		<div class="checkbox-row" id="unindexedReflectionsRow">
		<span style="color: #aa9a9a"><b>unindexed reflections:</b></span><input type="checkbox"
		id="unindexedReflectionsCheckbox"
		onclick="updateUnindexedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="indexedReflectionsRow">
		<span style="color: #e74c3c"><b>indexed reflections:</b> </span><input type="checkbox"
		id="indexedReflectionsCheckbox"
		onclick="updateIndexedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="calculatedReflectionsRow">
		<span style="color: #ffaaaa"><b>calculated reflections:</b> </span><input type="checkbox"
		id="calculatedReflectionsCheckbox"
		onclick="updateCalculatedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="integratedReflectionsRow">
		<span style="color: #ffc25c"><b>integrated reflections:</b> </span><input type="checkbox"
		id="integratedReflectionsCheckbox"
		onclick="updateIntegratedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="crystalFrameRow">
		<b>crystal frame:</b><input type="checkbox"
		id="crystalFrameCheckbox"
		onclick="updateCrystalFrame()">
		</div>

		<div class="checkbox-row" id="reciprocalCellRow">
		<b>reciprocal cell:</b><input type="checkbox" id="reciprocalCellCheckbox"
		onclick="updateReciprocalCell()" disabled>
		</div>

		<div class="checkbox-row" id="millerIndexLabelsRow">
		<b>Miller indices:</b><input type="checkbox" id="millerIndexLabelsCheckbox"
		onclick="updateMillerIndexLabels()" disabled>
		</div>

		<div id="millerIndexLabelSizeContainer" class="slider-container">
		<b>label size:</b>  <input type="range" min="5" max="50" value="8"
		class="slider" id="millerIndexLabelSizeSlider"
		onmouseup="updateMillerIndexLabelSize()">
		</div>

		<div id="unitCellAlignContainer" style="display:none; margin-bottom: 10px;">
			<b>align camera to:</b>
			<div class="axis-button-row">
				<button class="axis-btn" onclick="alignCameraToAxis(0)">a*</button>
				<button class="axis-btn" onclick="alignCameraToAxis(1)">b*</button>
				<button class="axis-btn" onclick="alignCameraToAxis(2)">c*</button>
			</div>
		</div>

		<div class="checkbox-row" id="ewaldSphereRow">
		<b>Ewald spheres:</b><input type="checkbox" id="ewaldSphereCheckbox"
		onclick="updateEwaldSpheres()" disabled>
		</div>

		<div id="reflectionSizeContainer" class="slider-container">
		<b>reflection size:</b>  <input type="range" min="1" max="25" value="10" 
		class="slider" id="reflectionSizeSlider" 
		onmouseup="updateReflectionSize()">
		</div>

		<div id="meshThresholdContainer" class="slider-container">
		<b style="color:#a8d5a2">mesh threshold:</b>
		<input type="range" min=".1" max="1" value=".5" step="0.001"
				class="slider" id="meshThresholdSlider"
				onmouseup="updateMesh()" oninput="updateThresholdValue()">
		<span id="meshThresholdValue"></span>
		</div>

		<div id="maxResolutionContainer" class="slider-container">
		<b style="color:#a8d5a2">mesh max res:</b>
		<input type="range" min=".1" max="6" value="1" step="0.001"
				class="slider" id="maxResolutionSlider"
				oninput="updateMaxResolutionValue()">
		<span id="maxResolutionValue"></span>
		</div>

		<div id="meshGridSizeContainer" style="display:flex; align-items:center; gap:4px; margin-bottom:10px; overflow:hidden;">
		<b style="color:#a8d5a2; flex-shrink:0; white-space:nowrap;">mesh grid:</b>
		<div style="display:inline-flex; flex-wrap:nowrap; gap:4px; align-items:center;">
			<label style="white-space:nowrap;"><input type="radio" name="meshGridSize" value="64"> 64</label>
			<label style="white-space:nowrap;"><input type="radio" name="meshGridSize" value="128" checked> 128</label>
			<label style="white-space:nowrap;"><input type="radio" name="meshGridSize" value="256"> 256</label>
		</div>
		</div>

		<div id="meshRecalculateContainer" style="display:none; margin-top: 8px; margin-bottom: 10px;">
		<button class="mesh-btn" onclick="recalculateMesh()">calculate mesh</button>
		</div>

		 <div class="dropdown">
			<button id="selectionDropdownButton" onclick="window.viewer.toggleExperimentList()" class="dropbtn"><b>Orientations </b><i class="fa fa-chevron-right" id="dropdownIcon"></i></button>
			<div id="selectionDropdown" class="dropdown-content">
			</div>
		</div> 
	</sidebar>
	<footer id="footerText"> </footer>
	<button class="btn" id="closeExpt" onmouseout="window.viewer.stopDisplayingText()" onmouseover="window.viewer.displayImageFilenames()" onclick="window.viewer.clearExperiment()"><i class="fa fa-trash"></i> expt file</button>
	<button class="btn" id="closeRefl" onmouseout="window.viewer.stopDisplayingText()" onmouseover="window.viewer.displayNumberOfReflections()" onclick="window.viewer.clearReflectionTable()"><i class="fa fa-trash"></i> refl file</button>
		<style>.slider{vertical-align:middle;appearance:none;--fill-color:#f8fafc;background:#1e293b;border-radius:5px;height:6px;margin-top:0}.slider::-webkit-slider-thumb{appearance:none;cursor:pointer;background:#000;border:2px solid #f8fafc;border-radius:50%;width:16px;height:16px;margin-top:-5px}.slider::-webkit-slider-runnable-track{background:linear-gradient(to right, var(--fill-color) 0%, var(--fill-color) var(--fill-percent), #444 var(--fill-percent), #444 100%);height:6px}.slider::-moz-range-thumb{cursor:pointer;background:#000;border:2px solid #f8fafc;border-radius:50%;width:16px;height:16px}.slider::-moz-range-progress{background:#f8fafc;border-radius:5px;height:6px}.slider::-moz-range-track{background:#444;border-radius:5px;height:6px}.experiment-label{color:#fff;cursor:pointer;background-color:#000100b3;border:none;width:80%;padding:10px;font-weight:700;display:block}.slider-container{white-space:nowrap;align-items:center;margin-bottom:10px;display:flex}.slider-container b{flex-shrink:0}.slider-container input[type=range]{flex-grow:1;min-width:50px;max-width:50%}.radio-group{flex-wrap:wrap;gap:8px;margin-top:4px;display:flex}.radio-group label{cursor:pointer}.dropbtn{color:#ddd;cursor:pointer;background-color:#000100b3;border-color:#000100b3;border-radius:10px;margin-bottom:-50px;margin-left:-6px;padding:10px 5px;font-family:Tahoma,Verdana,sans-serif;font-size:12px}.dropbtn:hover,.dropbtn:focus{background-color:#000100b3}.dropdown{gap:10px;min-width:100%;min-height:100%;display:inline-block;position:relative}.dropdown-content{z-index:1;background-color:#000100b3;border-radius:10px;min-width:105%;max-height:170px;margin-left:-8px;display:none;position:absolute;overflow:hidden scroll;box-shadow:0 8px 16px #0003}.dropdown-content a{color:#fff;padding:12px 16px;text-decoration:none;display:block;overflow:hidden scroll}.dropdown a:hover{background-color:#ddd}.show{display:block}#headerText{color:#ddd;text-align:center;z-index:9;white-space:pre-line;background-color:#000100b3;border-radius:10px;padding:8px;font-family:Tahoma,Verdana,sans-serif;font-size:16px;position:absolute;top:10px;left:50%;transform:translate(-50%)}#sidebar{color:#ddd;cursor:default;z-index:9;background-color:#000100b3;border-radius:10px;max-height:calc(100vh - 40px);padding:8px 8px 20px;font-family:Tahoma,Verdana,sans-serif;font-size:12px;line-height:1.2;display:block;position:absolute;top:50%;left:20px;overflow-y:auto;transform:translateY(-50%)}#sidebar.hidden{overflow-y:hidden;transform:translate(-280px,-50%)}#sidebarToggle{color:#ddd;cursor:pointer;background:0 0;border:#fff;padding:0;font-size:22px;line-height:1;position:absolute;top:50%;right:18px;transform:translateY(-50%)}#sidebar.hidden #sidebarToggle{right:0;transform:translateY(-50%)rotate(180deg)}#sidebarToggle:hover{opacity:.8}.checkbox-row{gap:6px;margin-bottom:10px}.axis-button-row{gap:6px;margin-top:4px;display:flex}.axis-btn{color:#ddd;cursor:pointer;background-color:#0000;border:1px solid #555;border-radius:6px;flex:1;padding:3px 10px;font-family:Tahoma,Verdana,sans-serif;font-size:12px}.axis-btn:hover{background-color:#ffffff1a;border-color:#aaa}.mesh-btn{color:#1a3a1a;cursor:pointer;white-space:nowrap;background-color:#a8d5a2;border:2px solid #fff;border-radius:6px;width:fit-content;padding:3px 10px;font-family:Tahoma,Verdana,sans-serif;font-size:12px;font-weight:700}.mesh-btn:hover{background-color:#8fc889}#closeExpt{color:#ddd;cursor:pointer;z-index:9;background-color:#000100b3;border-radius:10px;padding:8px;font-family:Tahoma,Verdana,sans-serif;font-size:14px;line-height:.7;display:none;position:absolute;top:5%;left:1%}#closeRefl{color:#ddd;cursor:pointer;z-index:9;background-color:#000100b3;border-radius:10px;padding:8px;font-family:Tahoma,Verdana,sans-serif;font-size:14px;line-height:.7;display:none;position:absolute;top:10%;left:1%}#reflectionSize{position:relative;top:8px}</style>

	
</body>
</html>
