<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DIALS Experiment Planner</title>
	<style>body{margin:0}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:0 0}::-webkit-scrollbar-thumb{background:#30425f;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#455e87}::-webkit-scrollbar-corner{background:0 0}</style>
  <script type="module" crossorigin src="./assets/main-VdLqbIlr.js"></script>
</head>
<body>
	<header id="headerText"> </header>
	<p id="errorText"> </p>
	<sidebar id="sidebar" style="width: 230px; padding: 10px;"> 
		<button id="sidebarToggle" onclick="window.viewer.toggleSidebar()" aria-label="Toggle sidebar">
			❮
		</button>
		<script>
			function updateObservedUnindexedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateObservedUnindexedReflections()
			}

			function updateObservedIndexedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateObservedIndexedReflections()
			}

			function updateCalculatedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateCalculatedReflections()
			}

			function updateReflectionSize(){
				window.viewer.disableMouseClick();
				window.viewer.updateReflectionSize();
			}

			function updateReciprocalCell(){
				window.viewer.disableMouseClick();
				window.viewer.updateReciprocalCell();
			}
			function updateActivePredictedReflections(){
				var goniometerSlider = document.getElementById("goniometerPhiSlider");
  				var goniometerValue = document.getElementById("goniometerValue");
  				goniometerValue.innerHTML = goniometerSlider.value + "°";
				window.viewer.disableMouseClick();
				window.viewer.updateActivePredictedReflections();
			}
			function updateGoniometerPhi(){
				var goniometerSlider = document.getElementById("goniometerPhiSlider");
  				var goniometerValue = document.getElementById("goniometerValue");
  				goniometerValue.innerHTML = goniometerSlider.value + "°";
			}

			function updateMillerIndexLabels(){
				window.viewer.disableMouseClick();
				window.viewer.updateMillerIndexLabelsVisibility();
			}

			function updateMillerIndexLabelSize(){
				window.viewer.disableMouseClick();
				window.viewer.updateMillerIndexLabelSize();
			}

		</script>
		<div id="reflectionSizeContainer" class="slider-container">
		<b>reflection size:</b>  <input type="range" min="1" max="75" value="10" 
		class="slider" id="reflectionSizeSlider" 
		onmouseup="updateReflectionSize()">
		</div>

		<div id="goniomterPhiContainer" class="slider-container">
		<b>φ:</b>  <input type="range" min="0" max="359" value="1"
		class="slider" id="goniometerPhiSlider"
		onmouseup="updateActivePredictedReflections()" onmousemove="updateGoniometerPhi()"><span id="goniometerValue"></span><br>
		</div>

		<div class="checkbox-row">
		<b>Miller indices:</b> <input type="checkbox" id="millerIndexLabelsCheckbox" onclick="updateMillerIndexLabels()">
		</div>

		<div style="margin-top: 10px;"></div>

		<div id="millerIndexLabelSizeContainer" class="slider-container">
		<b>label size:</b>  <input type="range" min="5" max="50" value="8"
		class="slider" id="millerIndexLabelSizeSlider"
		onmouseup="updateMillerIndexLabelSize()">
		</div>

	</sidebar>
	<footer id="footerText"> </footer>
	<button class="btn" id="closeExpt" onmouseout="window.viewer.stopDisplayingText()" onmouseover="window.viewer.displayImageFilenames()" onclick="window.viewer.clearExperiment()"><i class="fa fa-trash"></i> expt file</button>
	<button class="btn" id="closeRefl" onmouseout="window.viewer.stopDisplayingText()" onmouseover="window.viewer.displayNumberOfReflections()" onclick="window.viewer.clearReflectionTable()"><i class="fa fa-trash"></i> refl file</button>
		<style>.slider{vertical-align:middle;appearance:none;--fill-color:#f8fafc;background:#1e293b;border-radius:5px;height:6px;margin-top:0}.slider::-webkit-slider-thumb{appearance:none;cursor:pointer;background:#000;border:2px solid #f8fafc;border-radius:50%;width:16px;height:16px;margin-top:-5px}.slider::-webkit-slider-runnable-track{background:linear-gradient(to right, var(--fill-color) 0%, var(--fill-color) var(--fill-percent), #444 var(--fill-percent), #444 100%);height:6px}.slider::-moz-range-thumb{cursor:pointer;background:#000;border:2px solid #f8fafc;border-radius:50%;width:16px;height:16px}.slider::-moz-range-progress{background:#f8fafc;border-radius:5px;height:6px}.slider::-moz-range-track{background:#444;border-radius:5px;height:6px}.slider-container{white-space:nowrap;align-items:center;margin-bottom:10px;display:flex}.slider-container b{flex-shrink:0}.slider-container input[type=range]{flex-grow:1;min-width:50px;max-width:50%}#headerText{color:#ddd;text-align:center;z-index:9;white-space:pre-line;background-color:#000100b3;border-radius:10px;padding:8px;font-family:Tahoma,Verdana,sans-serif;font-size:16px;position:absolute;top:10px;left:50%;transform:translate(-50%)}#errorText{color:#e74c3c;text-align:center;z-index:9;white-space:pre-line;background-color:#000100b3;border-radius:10px;padding:8px;font-family:Tahoma,Verdana,sans-serif;font-size:16px;position:absolute;top:10px;left:50%;transform:translate(-50%)}#sidebar{color:#ddd;cursor:default;z-index:9;background-color:#000100b3;border-radius:10px;padding:8px 8px 20px;font-family:Tahoma,Verdana,sans-serif;font-size:12px;line-height:1.2;display:block;position:absolute;top:50%;left:20px;transform:translateY(-50%)}#sidebar.hidden{transform:translate(-260px,-50%)}#sidebarToggle{color:#ddd;cursor:pointer;background:0 0;border:#fff;padding:0;font-size:22px;line-height:1;position:absolute;top:50%;right:0;transform:translateY(-50%)}#sidebar.hidden #sidebarToggle{transform:translateY(-50%)rotate(180deg)}#closeExpt{color:#ddd;cursor:pointer;z-index:9;background-color:#000100b3;border-radius:10px;padding:8px;font-family:Tahoma,Verdana,sans-serif;font-size:14px;line-height:.7;display:none;position:absolute;top:5%;left:1%}#closeRefl{color:#ddd;cursor:pointer;z-index:9;background-color:#000100b3;border-radius:10px;padding:8px;font-family:Tahoma,Verdana,sans-serif;font-size:14px;line-height:.7;display:none;position:absolute;top:10%;left:1%}#reflectionSize,#goniometerPhi,#goniometerTheta{position:relative;top:8px}</style>

	
</body>
</html>
