<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Experiment</title>
	<style>body{margin:0}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:0 0}::-webkit-scrollbar-thumb{background:#30425f;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#455e87}::-webkit-scrollbar-corner{background:0 0}</style>
  <script type="module" crossorigin src="./assets/main-BZ8z8DIL.js"></script>
</head>
<body>
	<header id="headerText"> </header>
	<div id="viewToggle" style="display: none" role="group" aria-label="Panel view">
		<button id="view3DButton" class="view-toggle-button active" aria-pressed="true">3D</button>
		<button id="view2DButton" class="view-toggle-button" aria-pressed="false">2D</button>
	</div>
	<sidebar id="sidebar" class="hidden"> 
		<button id="sidebarToggle" onclick="window.viewer.toggleSidebar()" aria-label="Toggle sidebar">
			❮
		</button>
		<script>
			// Wrapper functions to prevent mouse events triggering underneath sidebar

			function updateObservedUnindexedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateObservedUnindexedReflections()
			}

			function updateObservedIndexedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateObservedIndexedReflections()
			}

			function updateCalculatedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateCalculatedReflections()
			}

			function updateIntegratedReflections(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateIntegratedReflections()
			}

			function updateBoundingBoxes(){
				window.viewer.disableMouseClick();
				window.viewer.updateBoundingBoxes();
			}

			function updateIntegratedBoundingBoxes(){
				window.viewer.disableMouseClick();
				window.viewer.updateIntegratedBoundingBoxes();
			}

			function updateResolutionRings(){
				window.viewer.disableMouseClick();
				window.viewer.updateResolutionRings();
			}

			function updateHklLabels(){
				window.viewer.disableMouseClick();
				window.viewer.updateHklLabels();
			}

			function updateAxes(){
				window.viewer.disableMouseClick(); 
				window.viewer.updateAxes()
			}

			function updateReflectionSize(){
				window.viewer.disableMouseClick();
				window.viewer.updateReflectionSize();
			}
			function updateUserContrast(){
				window.viewer.disableMouseClick();
				window.viewer.updatePanelTextures();
			}

		    function toggleSidebar() {
				const sidebar = document.getElementById("sidebar");
				const toggleBtn = document.getElementById("sidebarToggle");

				const isHidden = sidebar.classList.toggle("hidden");

				toggleBtn.textContent = isHidden ? "Show sidebar" : "Hide sidebar";
			}


		</script>

		<div id="panelControls" style="display: none">
			<div class="slider-container panel-nav-row">
				<b>panel:</b>
				<button id="panelPrev" class="image-step" aria-label="Previous panel"><i class="fa fa-chevron-left"></i></button>
				<span id="panelName2D" class="panel-name"></span>
				<button id="panelNext" class="image-step" aria-label="Next panel"><i class="fa fa-chevron-right"></i></button>
			</div>
		</div>

		<div id="imageControls" style="display: none">
			<div class="slider-container image-slider-row">
				<b>image:</b>
				<button id="imagePrev" class="image-step" aria-label="Previous image"><i class="fa fa-chevron-left"></i></button>
				<input type="range" min="1" max="1" value="1" step="1" class="slider" id="imageSlider">
				<button id="imageNext" class="image-step" aria-label="Next image"><i class="fa fa-chevron-right"></i></button>
			</div>
			<div class="image-input-row">
				<label for="imageNumber"><b>number:</b></label>
				<input type="number" min="1" value="1" step="1" id="imageNumber" class="image-input">
				<span id="numImagesText"></span>
			</div>
			<div class="image-input-row">
				<label for="imageStack"><b>stack:</b></label>
				<input type="number" min="1" value="1" step="1" id="imageStack" class="image-input">
			</div>
		</div>

		<div class="checkbox-row" id="observedUnindexedReflectionsRow">
		<span style="color: #aa9a9a"><b>unindexed reflections:</b></span><input type="checkbox"
		id="observedUnindexedReflections"
		onclick="updateObservedUnindexedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="observedIndexedReflectionsRow">
		<span style="color: #e74c3c"><b>indexed reflections:</b> </span><input type="checkbox"
		id="observedIndexedReflections"
		onclick="updateObservedIndexedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="calculatedReflectionsRow">
		<span style="color: #ffaaaa"><b>calculated reflections:</b> </span><input type="checkbox"
		id="calculatedReflections"
		onclick="updateCalculatedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="integratedReflectionsRow">
		<span style="color: #ffc25c"><b>integrated reflections:</b> </span><input type="checkbox"
		id="integratedReflections"
		onclick="updateIntegratedReflections()" disabled>
		</div>

		<div class="checkbox-row" id="boundingBoxesRow">
		<b>observed bounding boxes:</b> <input type="checkbox" id="boundingBoxes"
		onclick="updateBoundingBoxes()" disabled>
		</div>

		<div class="checkbox-row" id="integratedBoundingBoxesRow">
		<span style="color: #ffc25c"><b>integrated bounding boxes:</b> </span><input type="checkbox"
		id="integratedBoundingBoxes"
		onclick="updateIntegratedBoundingBoxes()" disabled>
		</div>

		<div class="checkbox-row" id="resolutionRingsRow" style="display: none">
		<b>resolution rings:</b> <input type="checkbox"
		id="resolutionRings"
		onclick="updateResolutionRings()" disabled>
		</div>

		<div class="checkbox-row" id="hklLabelsRow" style="display: none">
		<b>Miller indices:</b> <input type="checkbox"
		id="hklLabels"
		onclick="updateHklLabels()">
		</div>

		<div id="hklLabelSizeContainer" class="slider-container" style="display: none">
		<b>label size:</b>  <input type="range" min="5" max="40" value="12"
		class="slider" id="hklLabelSizeSlider"
		oninput="updateHklLabels()">
		</div>

		<div id="reflectionSizeContainer" class="slider-container">
		<b>reflection size:</b>  <input type="range" min="1" max="25" value="10" 
		class="slider" id="reflectionSizeSlider" 
		onmouseup="updateReflectionSize()">
		</div>

		<div id="contrastContainer" class="slider-container">
		<b>contrast:</b>  <input type="range" min="0.001" max="20" value="1" step="0.001" 
		class="slider" id="userContrast" onclick="window.viewer.disableMouseClick()"
		onmouseup="updateUserContrast()"  style="margin-top: 10px; vertical-align: middle; position: relative; top: -3px;">
		</div>

		 <div class="dropdown">
			<button onclick="window.viewer.toggleExperimentList()" class="dropbtn"><b>Orientations </b><i class="fa fa-chevron-right" id="dropdownIcon"></i></button>
			<div id="experimentDropdown" class="dropdown-content">
			</div>
		</div> 
	</sidebar>
	<footer id="footerText"> </footer>
	<button class="btn" id="closeExpt" onmouseout="window.viewer.stopDisplayingText()" onmouseover="window.viewer.displayImageFilenames()" onclick="window.viewer.clearExperiment()"><i class="fa fa-trash"></i> expt file</button>
	<button class="btn" id="closeRefl" onmouseout="window.viewer.stopDisplayingText()" onmouseover="window.viewer.displayNumberOfReflections()" onclick="window.viewer.clearReflectionTable()"><i class="fa fa-trash"></i> refl file</button>
		<style>.slider{vertical-align:middle;appearance:none;--fill-color:#f8fafc;background:#1e293b;border-radius:5px;height:6px;margin-top:0}.slider-container{white-space:nowrap;align-items:center;margin-bottom:10px;display:flex}.slider-container b{flex-shrink:0}.slider-container input[type=range]{flex:auto;min-width:40px;max-width:50%;margin:0 6px}.slider-container span{flex-shrink:0}.slider::-webkit-slider-thumb{appearance:none;cursor:pointer;background:#000;border:2px solid #f8fafc;border-radius:50%;width:16px;height:16px;margin-top:-5px}.slider::-webkit-slider-runnable-track{background:linear-gradient(to right, var(--fill-color) 0%, var(--fill-color) var(--fill-percent), #444 var(--fill-percent), #444 100%);height:6px}.slider::-moz-range-thumb{cursor:pointer;background:#000;border:2px solid #f8fafc;border-radius:50%;width:16px;height:16px}.slider::-moz-range-progress{background:#f8fafc;border-radius:5px;height:6px}.slider::-moz-range-track{background:#444;border-radius:5px;height:6px}.experiment-label{color:#fff;cursor:pointer;background-color:#000100b3;border:none;width:80%;padding:10px;font-weight:700;display:block}.dropbtn{color:#ddd;cursor:pointer;background-color:#000100b3;border-color:#000100b3;border-radius:10px;margin-left:-6px;padding:5px;font-family:Tahoma,Verdana,sans-serif;font-size:12px}.dropbtn:hover,.dropbtn:focus{background-color:#000100b3}.dropdown{min-width:100%;min-height:100%;display:inline-block;position:relative}.dropdown-content{z-index:1;background-color:#000100b3;border-radius:10px;min-width:105%;max-height:120px;margin-left:-8px;display:none;position:absolute;overflow:hidden scroll;box-shadow:0 8px 16px #0003}.dropdown-content a{color:#fff;padding:12px 6px;text-decoration:none;display:block;overflow:hidden scroll}.dropdown a:hover{background-color:#ddd}.show{display:block}#headerText{color:#ddd;text-align:center;z-index:9;white-space:pre-line;background-color:#000100b3;border-radius:10px;padding:8px;font-family:Tahoma,Verdana,sans-serif;fon </body>
</html>
