name: Conda packages

# Builds the diffraview (noarch) and diffraview-desktop (Linux, Windows) conda
# packages from the commit being tested, installs them into a fresh
# environment with DIALS and runs the tests, then publishes them to
# anaconda.org for version tags, or when run manually with "publish" ticked.
#
# Outside pull requests it also builds the Windows installer (installer/) from
# those packages and test-installs it. For version tags it also builds the
# AppImage and .dmg (build-desktop.yml) and attaches all three to a draft
# GitHub release.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - src/**
      - client/**
      - recipe/**
      - recipe-desktop/**
      - installer/**
      - tests/**
      - pyproject.toml
      - .github/workflows/conda-packages.yml
  pull_request:
    paths:
      - src/**
      - client/**
      - recipe/**
      - recipe-desktop/**
      - installer/**
      - tests/**
      - pyproject.toml
      - .github/workflows/conda-packages.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the packages to anaconda.org
        type: boolean
        default: false
      label:
        description: anaconda.org label to upload under
        default: main

concurrency:
  group: conda-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  # DIALS main builds (dials-main.yml), until DIALS 3.31 is on conda-forge
  DIALS_CHANNEL: https://conda.anaconda.org/${{ vars.ANACONDA_CHANNEL }}/label/dials-main

defaults:
  run:
    shell: bash -el {0}

jobs:
  diffraview:
    name: diffraview (noarch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import json, re, sys
          tag = sys.argv[1]
          found = {
              "pyproject.toml": re.search(r'^version = "([^"]+)"', open("pyproject.toml").read(), re.M),
              "src/diffraview/__init__.py": re.search(r'__version__ = "([^"]+)"', open("src/diffraview/__init__.py").read()),
              "recipe/meta.yaml": re.search(r'set version = "([^"]+)"', open("recipe/meta.yaml").read()),
              "recipe-desktop/meta.yaml": re.search(r'set version = "([^"]+)"', open("recipe-desktop/meta.yaml").read()),
          }
          versions = {f: m.group(1) for f, m in found.items()}
          versions["client/package.json"] = json.load(open("client/package.json"))["version"]
          m = re.search(r'"DIFFRAVIEW_VERSION", "([^"]+)"', open("installer/construct.yaml").read())
          versions["installer/construct.yaml"] = m.group(1)
          # conda versions can't contain "-" (0.1.2rc1), npm's need it (0.1.2-rc1)
          wrong = {f: v for f, v in versions.items() if v.replace("-", "") != tag.replace("-", "")}
          for f, v in wrong.items():
              print(f"::error file={f}::version {v} does not match tag v{tag}")
          sys.exit(1 if wrong else 0)
          EOF

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
          auto-activate: true
          activate-environment: base

      - name: Install conda-build
        run: conda install -y -n base conda-build

      - name: Build
        run: conda build recipe -c "$DIALS_CHANNEL" -c conda-forge --override-channels --output-folder dist

      - uses: actions/upload-artifact@v7
        with:
          name: conda-noarch
          path: dist/noarch/*.conda
          if-no-files-found: error

  desktop:
    name: diffraview-desktop (${{ matrix.subdir }})
    needs: diffraview
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            subdir: linux-64
          - os: windows-latest
            subdir: win-64
    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
          auto-activate: true
          activate-environment: base

      - name: Install conda-build
        run: conda install -y -n base conda-build

      # The recipe's test installs the matching diffraview, built above
      - uses: actions/download-artifact@v8
        with:
          name: conda-noarch
          path: local-channel/noarch

      - name: Index the local channel
        run: python -m conda_index local-channel

      # Keep the build root short on Windows: node_modules makes for deep
      # paths, and Windows limits paths to 260 characters
      - name: Build
        env:
          CONDA_BLD_PATH: ${{ runner.os == 'Windows' && 'C:\bld' || format('{0}/bld', runner.temp) }}
        run: |
          channel=$(python -c "import pathlib; print(pathlib.Path('local-channel').resolve().as_uri())")
          conda build recipe-desktop -c "$channel" -c "$DIALS_CHANNEL" -c conda-forge --override-channels \
            --croot "$CONDA_BLD_PATH" --output-folder dist

      - uses: actions/upload-artifact@v7
        with:
          name: conda-${{ matrix.subdir }}
          path: dist/${{ matrix.subdir }}/*.conda
          if-no-files-found: error

  test:
    name: Test (${{ matrix.subdir }})
    needs: desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            subdir: linux-64
          - os: windows-latest
            subdir: win-64
    steps:
      - uses: actions/checkout@v7

      # Test data from Zenodo, which sometimes drops large downloads
      - uses: actions/cache@v4
        with:
          path: test-data
          key: test-data-sxd-nacl-v1

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
          auto-activate: true
          activate-environment: base

      - uses: actions/download-artifact@v8
        with:
          name: conda-noarch
          path: local-channel/noarch

      - uses: actions/download-artifact@v8
        with:
          name: conda-${{ matrix.subdir }}
          path: local-channel/${{ matrix.subdir }}

      - name: Install DiffraView and DIALS into a fresh environment
        run: |
          conda install -y -n base conda-index
          python -m conda_index local-channel
          channel=$(python -c "import pathlib; print(pathlib.Path('local-channel').resolve().as_uri())")
          conda create -y -n diffraview -c "$channel" -c "$DIALS_CHANNEL" -c conda-forge --override-channels \
            diffraview diffraview-desktop pytest pytest-asyncio

      - name: Test, without activating the environment
        run: |
          prefix=$(conda run -n diffraview python -c "import sys; print(sys.prefix)")
          python - "$prefix" <<'EOF'
          import os, subprocess, sys
          prefix = sys.argv[1].strip()
          windows = os.name == "nt"
          python = os.path.join(prefix, "python.exe" if windows else os.path.join("bin", "python"))
          env = {k: v for k, v in os.environ.items() if not k.startswith("CONDA")}
          env["PATH"] = os.path.join(os.environ["SystemRoot"], "System32") if windows else "/usr/bin:/bin"
          env["DIFFRAVIEW_TEST_DATA"] = os.path.abspath("test-data")
          checks = [
              [python, "-c", "from diffraview.launcher import find_desktop_app; app = find_desktop_app(); print(app); assert app"],
              [python, "-m", "pytest", "tests", "-v", "-p", "no:cacheprovider"],
          ]
          for cmd in checks:
              print("+", " ".join(cmd), flush=True)
              subprocess.run(cmd, env=env, check=True)
          EOF

  publish:
    name: Publish to anaconda.org
    needs: test
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: conda-*
          path: dist

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
          auto-activate: true
          activate-environment: base

      - name: Install anaconda-client
        run: conda install -y anaconda-client

      - name: Upload
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          CHANNEL: ${{ vars.ANACONDA_CHANNEL }}
          # Release candidates (v0.1.2-rc1) go to the rc label
          LABEL: ${{ inputs.label || (contains(github.ref_name, '-') && 'rc') || 'main' }}
        run: |
          if [[ -z "$ANACONDA_API_TOKEN" ]]; then
            echo "::error::The ANACONDA_API_TOKEN secret is not set." >&2
            exit 1
          fi
          if [[ -z "$CHANNEL" ]]; then
            echo "::error::Set the ANACONDA_CHANNEL repository variable to the anaconda.org user or organisation to upload to." >&2
            exit 1
          fi
          mapfile -t packages < <(find dist -name '*.conda' | sort)
          printf 'Uploading to %s (label %s):\n' "$CHANNEL" "$LABEL"
          printf '  %s\n' "${packages[@]}"
          # --skip-existing: a re-run doesn't fail on, or overwrite, packages
          # already uploaded.
          anaconda upload --user "$CHANNEL" --label "$LABEL" --skip-existing "${packages[@]}"

  installer:
    name: Windows installer
    needs: test
    # Slow (it bundles all of DIALS), so not for every pull request
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Test data from Zenodo, which sometimes drops large downloads
      - uses: actions/cache@v4
        with:
          path: test-data
          key: test-data-sxd-nacl-v1

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
          auto-activate: true
          activate-environment: base

      - name: Install constructor
        run: conda install -y -n base constructor conda-index

      # Bundle the packages this run built and tested
      - uses: actions/download-artifact@v8
        with:
          name: conda-noarch
          path: local-channel/noarch

      - uses: actions/download-artifact@v8
        with:
          name: conda-win-64
          path: local-channel/win-64

      - name: Build
        run: |
          python -m conda_index local-channel
          DIFFRAVIEW_CHANNEL=$(python -c "import pathlib; print(pathlib.Path('local-channel').resolve().as_uri())")
          export DIFFRAVIEW_CHANNEL
          constructor installer --output-dir dist

      - name: Install
        shell: pwsh
        run: |
          $exe = Get-Item dist\DiffraView-*-Windows-x86_64.exe
          $prefix = Join-Path $env:RUNNER_TEMP "Diffra View\DiffraView"
          # /D= must come last and unquoted, so pass one argument string
          $p = Start-Process -Wait -PassThru -FilePath $exe.FullName `
            -ArgumentList "/InstallationType=JustMe /S /D=$prefix"
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $prefix "pythonw.exe"))) { throw "Nothing installed in $prefix" }
          "DIFFRAVIEW_PREFIX=$prefix" >> $env:GITHUB_ENV

      - name: Check the shortcuts
        shell: pwsh
        run: |
          $shell = New-Object -ComObject WScript.Shell
          $places = @{
            "Start menu" = [Environment]::GetFolderPath("Programs")
            "Desktop" = [Environment]::GetFolderPath("Desktop")
          }
          foreach ($place in $places.GetEnumerator()) {
            $lnk = Get-ChildItem $place.Value -Recurse -Filter "DiffraView*.lnk" | Select-Object -First 1
            if (-not $lnk) { throw "No DiffraView shortcut in $($place.Key) ($($place.Value))" }
            $target = $shell.CreateShortcut($lnk.FullName)
            "$($place.Key): $($lnk.FullName)"
            "  -> $($target.TargetPath) $($target.Arguments)"
            $pythonw = Join-Path $env:DIFFRAVIEW_PREFIX "pythonw.exe"
            if ($target.TargetPath -ne $pythonw) { throw "Shortcut runs $($target.TargetPath), not $pythonw" }
          }

      - name: Test, without activating the installation
        run: |
          tests_dir="$RUNNER_TEMP/test dir with spaces"
          mkdir -p "$tests_dir"
          cp -r tests "$tests_dir/"
          python="$DIFFRAVIEW_PREFIX/python.exe"
          # pytest isn't part of the installation; keep it out of it
          "$python" -m pip install -q --target "$RUNNER_TEMP/pytest-libs" pytest pytest-asyncio
          python - "$python" "$tests_dir" "$RUNNER_TEMP/pytest-libs" <<'PY'
          import os, subprocess, sys
          python, tests_dir, libs = sys.argv[1:]
          env = {k: v for k, v in os.environ.items() if not k.startswith("CONDA")}
          env["PATH"] = os.path.join(os.environ["SystemRoot"], "System32")
          env["PYTHONPATH"] = libs
          env["DIFFRAVIEW_TEST_DATA"] = os.path.abspath("test-data")
          checks = [
              [python, "-c", "from diffraview.launcher import find_desktop_app; app = find_desktop_app(); print(app); assert app"],
              [python, "-m", "pytest", "tests", "-v", "-p", "no:cacheprovider"],
          ]
          for cmd in checks:
              print("+", " ".join(cmd), flush=True)
              subprocess.run(cmd, env=env, cwd=tests_dir, check=True)
          PY

      - name: Uninstall
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:DIFFRAVIEW_PREFIX "Uninstall-DiffraView.exe"
          # _?= makes the uninstaller run in place, so -Wait waits for it
          $p = Start-Process -Wait -PassThru -FilePath $uninstaller `
            -ArgumentList "/S _?=$env:DIFFRAVIEW_PREFIX"
          if ($p.ExitCode -ne 0) { throw "Uninstaller exited with $($p.ExitCode)" }
          foreach ($folder in [Environment]::GetFolderPath("Programs"), [Environment]::GetFolderPath("Desktop")) {
            $left = Get-ChildItem $folder -Recurse -Filter "DiffraView*.lnk"
            if ($left) { throw "Shortcuts left after uninstalling: $($left.FullName -join ', ')" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: installer-win-64
          path: dist/*.exe
          if-no-files-found: error

  # AppImage and .dmg, for users with their own DIALS
  desktop-apps:
    name: Desktop apps
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-desktop.yml

  release:
    name: Draft release
    needs: [installer, desktop-apps]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{installer-win-64,DiffraView-*}"
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: DiffraView ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
