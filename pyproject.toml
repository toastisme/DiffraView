[build-system]
requires = ["setuptools>=77"]  # PEP 639 `license = "SPDX-expr"` needs >=77
build-backend = "setuptools.build_meta"

[project]
name = "diffraview"
version = "0.1.2rc2"
description = "Browser/desktop interface for processing and visualising single-crystal diffraction data."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "David McDonagh" }]
requires-python = ">=3.10"  
# Also requires dials and dxtbx, which are not distributed on PyPI.
# diffraview must be installed into an existing DIALS environment (e.g. via
# a DIALS conda installation) that already provides those packages.
dependencies = [
    "websockets>=14",  # process_request(connection, request) API
    "lz4",
    "aiofiles",
    "msgpack",
    "numpy",
    "scipy",
    "wxPython",
]

[project.urls]
Homepage = "https://github.com/toastisme/diffraview"
Repository = "https://github.com/toastisme/diffraview"

[project.scripts]
diffraview = "diffraview.launcher:main"
diffraview-server = "diffraview.server:main"

[tool.setuptools.packages.find]
where = ["src"]

# The built web client, copied in by `npm run build:web` in client/.
[tool.setuptools.package-data]
diffraview = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
