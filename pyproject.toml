[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffraview"
version = "0.1.0"
description = "Browser/desktop interface for processing and visualising single-crystal diffraction data."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "David McDonagh" }]
requires-python = ">=3.9"
# Also requires dials and dxtbx, which are not distributed on PyPI.
# diffraview must be installed into an existing DIALS environment (e.g. via
# a DIALS conda installation) that already provides those packages.
dependencies = [
    "websockets",
    "lz4",
    "aiofiles",
    "msgpack",
    "numpy",
    "scipy",
    "wxPython",
    "dash-bootstrap-components",
]

[project.urls]
Homepage = "https://github.com/toastisme/diffraview"
Repository = "https://github.com/toastisme/diffraview"

[project.scripts]
diffraview-server = "diffraview.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
